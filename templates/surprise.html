<!DOCTYPE html>
<html>

<head>
    <title>Surprise for {{ name }} ❤️</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div id="envelope" class="envelope" onclick="openLetter()">
            💌
            <p>Tap me!</p>
        </div>

        <div id="message" class="message">

            <div class="emoji">🎉</div>
              {% if photo %}
    <img
        src="{{ url_for('static', filename='../uploads/' + photo) }}"
        class="profile-photo"
    >
{% endif %}

            <h1>Surprise, {{ name }}! ❤️</h1>

            <h2>Happy {{ occasion }}! 🎊</h2>

            <p class="personal-message">
    {{ message }}
</p>

            <div class="hearts">
                ❤️ 💕 💖 💗 ❤️
            </div>
              <button onclick="copySurpriseLink()" class="share-button">
    🔗 Copy Surprise Link
</button>

            <a href="/" class="back-button">
                🎁 Create Another Surprise
            </a>

        </div>

    </div>


    <script>

        function openLetter() {

            document.getElementById("envelope").style.display = "none";

            document.getElementById("message").style.display = "block";

            createConfetti();
        }


        function createConfetti() {

            const emojis = [
                "🎉",
                "🎊",
                "❤️",
                "💖",
                "✨",
                "🎈"
            ];

            for (let i = 0; i < 40; i++) {

                const confetti =
                    document.createElement("div");

                confetti.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random() * emojis.length
                        )
                    ];

                confetti.style.position = "fixed";
                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.top = "-30px";

                confetti.style.fontSize =
                    (15 + Math.random() * 20) + "px";

                confetti.style.zIndex = "9999";

                document.body.appendChild(confetti);

                const duration =
                    3 + Math.random() * 3;

                confetti.animate(
                    [
                        {
                            transform:
                                "translateY(0) rotate(0deg)",
                            opacity: 1
                        },
                        {
                            transform:
                                "translateY(110vh) rotate(720deg)",
                            opacity: 0
                        }
                    ],
                    {
                        duration: duration * 1000,
                        easing: "linear"
                    }
                );

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
      
      async function shareSurprise() {

    const link = window.location.href;

    const shareData = {
        title: "🎁 A Surprise For You!",
        text: "Someone created a special surprise for you ❤️",
        url: link
    };

    try {

        if (navigator.share) {

            await navigator.share(shareData);

        } else {

            await navigator.clipboard.writeText(link);

            alert("🔗 Surprise link copied!");

        }

    } catch (error) {

        if (error.name !== "AbortError") {

            alert("Please copy this link:\n\n" + link);

        }
    }
}
      
      function copySurpriseLink() {

    const link = window.location.href;

    const textArea = document.createElement("textarea");

    textArea.value = link;

    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";

    document.body.appendChild(textArea);

    textArea.focus();
    textArea.select();

    try {

        document.execCommand("copy");

        alert("✅ Surprise link copied!");

    } catch (error) {

        alert(
            "Copy failed. Please copy this link manually:\n\n"
            + link
        );

    }

    document.body.removeChild(textArea);
}

    </script>

</body>

              </html>
